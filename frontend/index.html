<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>家計ダッシュボード</title>
    <!--
      Font loading: PlayStation SST (proprietary) is substituted per
      DESIGN.md guidance with Roboto Light (300) for the display tier and
      Inter (400/500/600) for body/chrome. Loaded via Google Fonts <link>
      tags here (rather than a CSS @import) so the browser can discover and
      preconnect the font request before the stylesheet is parsed.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto:wght@300&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
